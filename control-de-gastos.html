<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Control de gastos</title>
    <style>
      /* ===== Diseño 4 — Verde Finanzas (igual al ejemplo) ===== */
      :root{
        --bg:#f2f7f3;
        --ink:#12261a;
        --hero:#14532d;
        --hero-ink:#ecfdf5;
        --hero-sub:#a7d7b5;
        --line:#dcebdf;
        --row-line:#ddebe0;
        --icon-bg:#dcfce7;
        --green:#16a34a;
        --green-dark:#14532d;
        --pill-bg:#dcfce7;
        --pill-ink:#166534;
        --muted:#5b7263;
        --red:#dc2626;
        --red-bg:#fef2f2;
        --red-line:#fecaca;
        --amber:#b45309;
        --amber-bg:#fffbeb;
        --amber-line:#fde68a;
        --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      *{ box-sizing:border-box; }
      html,body{ margin:0; padding:0; }
      body{
        font-family:var(--sans);
        background:#e6f0e8;
        color:var(--ink);
        -webkit-font-smoothing:antialiased;
      }
      .mono{ font-family:var(--mono); }
      .app{
        max-width:480px; margin:0 auto;
        background:var(--bg);
        min-height:100dvh;
        display:flex; flex-direction:column;
        box-shadow:0 0 0 1px var(--line);
        position:relative;
      }

      /* ---------- Encabezado: título + selector de mes ---------- */
      header{
        position:sticky; top:0; z-index:20;
        background:var(--bg);
        padding:14px 16px 8px;
      }
      .head-row{ display:flex; justify-content:space-between; align-items:center; }
      .head-row .title{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
      .month-pill{
        background:var(--pill-bg); color:var(--pill-ink);
        border:none; cursor:pointer; font:inherit;
        padding:6px 12px; border-radius:999px;
        font-size:11.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
        display:flex; align-items:center; gap:5px;
      }
      .month-pill:active{ background:#bbf7d0; }

      /* ---------- Contenido ---------- */
      main{ flex:1; padding:2px 16px 120px; }
      .hero{
        background:var(--hero); color:var(--hero-ink);
        border-radius:16px; padding:16px; margin-top:6px;
      }
      .hero small{
        color:var(--hero-sub); font-size:11px; letter-spacing:.08em;
        text-transform:uppercase; font-weight:700; display:block;
      }
      .hero .total{ font-size:31px; font-weight:600; margin:5px 0 3px; font-family:var(--mono); letter-spacing:-.01em; }
      .hero .cmp{ color:var(--hero-ink); font-size:12.5px; font-weight:600; }
      .hero .cmp.dim{ color:var(--hero-sub); font-weight:500; }

      .statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
      .stat{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
      .stat small{ color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; display:block; }
      .stat b{ font-size:16.5px; display:block; margin:3px 0 2px; font-family:var(--mono); font-weight:600; }
      .stat .sub{ font-size:11.5px; font-weight:600; color:var(--muted); }
      .stat .sub.ok{ color:var(--green); }
      .stat .sub.bad{ color:var(--red); }

      .sec-title{ font-weight:800; margin:18px 0 2px; font-size:15px; }

      .expense{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--row-line); }
      .expense:last-child{ border-bottom:none; }
      .expense .ic{
        width:38px; height:38px; border-radius:10px; background:var(--icon-bg);
        display:grid; place-items:center; font-size:17px; flex-shrink:0;
      }
      .expense .meta{ flex:1; min-width:0; }
      .expense .meta b{ display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .expense .meta small{ color:rgba(18,38,26,.62); font-size:11.5px; display:block; margin-top:1px; }
      .expense .amt{ font-weight:700; font-size:14px; white-space:nowrap; font-family:var(--mono); }
      .expense .amt.neg{ color:var(--ink); }
      button.expense{ width:100%; background:none; border:none; border-bottom:1px solid var(--row-line); font:inherit; color:inherit; text-align:left; cursor:pointer; padding:10px 0; }
      button.expense:active{ background:#e9f4ec; }
      .tag{
        display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.05em;
        background:var(--icon-bg); color:var(--pill-ink);
        border-radius:99px; padding:1px 6px; margin-left:6px; vertical-align:2px; text-transform:uppercase;
      }
      .empty{
        text-align:center; color:var(--muted); font-size:13.5px; line-height:1.55;
        padding:22px 14px; border:1px dashed var(--line); border-radius:12px; background:#fff; margin-top:10px;
      }

      .alert{
        border-radius:12px; padding:11px 12px; font-size:13px; line-height:1.45;
        margin-top:8px; display:flex; gap:9px; align-items:flex-start;
      }
      .alert .dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; }
      .alert.over{ background:var(--red-bg); color:#7f1d1d; border:1px solid var(--red-line); }
      .alert.over .dot{ background:var(--red); }
      .alert.near{ background:var(--amber-bg); color:#78350f; border:1px solid var(--amber-line); }
      .alert.near .dot{ background:#f59e0b; }

      /* ---------- Filtros ---------- */
      .filters{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
      .filters .row{ display:flex; gap:8px; }
      .filters .row > *{ flex:1; min-width:0; }
      input[type="text"], input[type="number"], input[type="date"], select{
        width:100%; font:inherit; font-size:14px; color:var(--ink);
        border:1px solid var(--line); border-radius:10px;
        padding:10px 11px; background:#fff; appearance:none;
      }
      input:focus, select:focus{ outline:2px solid var(--green); outline-offset:0; border-color:var(--green); }
      .list-head{
        display:flex; justify-content:space-between; align-items:baseline; gap:8px;
        font-size:12.5px; color:var(--muted); margin:12px 0 0;
      }
      .list-head b{ color:var(--ink); }
      .mini-link{ background:none; border:none; font:inherit; font-size:12.5px; font-weight:700; color:var(--green-dark); cursor:pointer; padding:4px 0; text-decoration:underline; }

      /* ---------- Resumen / presupuestos ---------- */
      .cat-detail{ padding:11px 0; border-bottom:1px solid var(--row-line); }
      .cat-detail:last-child{ border-bottom:none; }
      .cat-detail .top{ display:flex; align-items:center; gap:10px; }
      .bar{ height:8px; background:#e2efe4; border-radius:99px; overflow:hidden; margin-top:9px; }
      .bar i{ display:block; height:100%; border-radius:99px; }
      .bar i.near{ background:#f59e0b !important; }
      .bar i.over{ background:var(--red) !important; }
      .cat-nums{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:7px; }
      .cat-nums b{ color:var(--ink); }
      .status-over{ color:var(--red); font-weight:700; }
      .status-near{ color:var(--amber); font-weight:700; }
      .status-ok{ color:var(--green); font-weight:700; }
      .tope-row{ display:flex; align-items:center; gap:8px; margin-top:9px; }
      .tope-row label{ font-size:12.5px; color:var(--muted); white-space:nowrap; font-weight:600; }
      .tope-row input{ text-align:right; font-family:var(--mono); padding:8px 10px; }

      /* ---------- Quincenas ---------- */
      .qcard{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; background:#fff; }
      .qcard .qtop{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
      .qcard .qtop b{ font-size:15px; font-weight:800; }
      .qcard .qtop span{ font-size:11.5px; color:var(--muted); font-weight:700; white-space:nowrap; }
      .qnums{ display:flex; gap:8px; margin-top:10px; }
      .qnums .qn{ flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
      .qnums .qn small{ display:block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
      .qnums .qn b{ font-family:var(--mono); font-size:14.5px; display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .amt.pos{ color:var(--green-dark); }
      .other-line{
        display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
        font-size:12.5px; color:var(--muted); margin-top:9px;
      }
      .other-line b{ color:var(--green-dark); font-family:var(--mono); }

      /* ---------- Tarjetas y formularios (Ajustes / Fijos) ---------- */
      .card{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; background:#fff; }
      .card h3{ margin:0 0 10px; font-size:14.5px; font-weight:800; }
      .field{ margin-bottom:10px; }
      .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
      .field-row{ display:flex; gap:8px; }
      .field-row > *{ flex:1; min-width:0; }
      .btn{
        font:inherit; font-size:15px; font-weight:700; cursor:pointer;
        border:none; border-radius:12px; padding:12px 16px;
        background:var(--green); color:#fff; width:100%;
      }
      .btn:active{ background:#15803d; }
      .btn.secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); }
      .btn.secondary:active{ background:#eef5ef; }
      .btn.danger{ background:#fff; color:var(--red); border:1px solid var(--red-line); }
      .btn.danger:active{ background:var(--red-bg); }
      .btn + .btn{ margin-top:8px; }
      .seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
      .seg button{
        flex:1; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
        padding:10px 2px; background:#fff; color:var(--muted); border:none;
        border-right:1px solid var(--line);
      }
      .seg button:last-child{ border-right:none; }
      .seg button.on{ background:var(--green-dark); color:#fff; }
      .hint{ font-size:12.5px; color:var(--muted); line-height:1.55; }
      .icon-btn{
        border:none; background:none; cursor:pointer; color:#9db8a5;
        width:34px; height:34px; border-radius:8px; flex:none;
        display:flex; align-items:center; justify-content:center;
      }
      .icon-btn:active{ background:var(--red-bg); color:var(--red); }

      .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
      .swatch{ width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
      .swatch.on{ border-color:var(--ink); box-shadow:0 0 0 2px #fff inset; }
      .emojis{ display:flex; gap:6px; flex-wrap:wrap; }
      .emoji-btn{
        width:40px; height:40px; border-radius:10px; border:1.5px solid var(--line);
        background:#fff; font-size:18px; cursor:pointer; display:grid; place-items:center; padding:0;
      }
      .emoji-btn.on{ border-color:var(--green-dark); background:var(--icon-bg); }
      .color-dot{ width:12px; height:12px; border-radius:50%; flex:none; }

      /* ---------- FAB y barra inferior (igual al ejemplo) ---------- */
      .fab{
        position:fixed; z-index:30;
        right:max(16px, calc(50% - 240px + 16px)); bottom:70px;
        width:52px; height:52px; border-radius:16px;
        background:var(--green); color:#fff; border:none; cursor:pointer;
        font-size:27px; font-weight:700; line-height:1;
        display:grid; place-items:center;
        box-shadow:0 8px 18px rgba(20,83,45,.30);
      }
      .fab:active{ background:#15803d; }
      nav.tabs{
        position:fixed; z-index:25; bottom:0; left:50%; transform:translateX(-50%);
        width:min(480px,100%);
        background:#fff; border-top:1px solid var(--line); color:var(--green-dark);
        display:flex; justify-content:space-around; align-items:stretch;
        padding-bottom:env(safe-area-inset-bottom);
      }
      nav.tabs button{
        flex:1; border:none; background:none; cursor:pointer; font:inherit;
        font-size:10px; font-weight:700; color:inherit;
        padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:2px;
        opacity:.55;
      }
      nav.tabs button i{ font-style:normal; font-size:17px; line-height:1; }
      nav.tabs button.on{ opacity:1; }

      /* ---------- Hojas (bottom sheet) y modal ---------- */
      .overlay{ position:fixed; inset:0; z-index:40; background:rgba(18,38,26,.45); display:none; }
      .overlay.open{ display:block; }
      .sheet{
        position:fixed; z-index:41; left:50%; transform:translate(-50%,105%);
        bottom:0; width:min(480px,100%);
        background:#fff; border-radius:20px 20px 0 0;
        padding:18px 16px calc(18px + env(safe-area-inset-bottom));
        transition:transform .25s ease;
        max-height:92dvh; overflow-y:auto;
      }
      .sheet.open{ transform:translate(-50%,0); }
      .sheet h2{ margin:0 0 14px; font-size:17px; font-weight:800; }
      .sheet .actions{ display:flex; gap:8px; margin-top:4px; }
      .sheet .actions .btn{ flex:1; width:auto; }
      .sheet .actions .btn + .btn{ margin-top:0; }
      .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
      .month-grid button{
        font:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
        padding:11px 4px; border-radius:10px; border:1px solid var(--line);
        background:#fff; color:var(--ink); text-transform:capitalize;
      }
      .month-grid button.on{ background:var(--green-dark); color:#fff; border-color:var(--green-dark); }
      .year-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
      .year-row b{ font-size:16px; }
      .year-row button{
        width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
        background:#fff; font-size:17px; cursor:pointer; color:var(--ink);
        display:flex; align-items:center; justify-content:center;
      }
      .modal{
        position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
        width:min(420px, calc(100vw - 32px));
        background:#fff; border-radius:16px; padding:18px 16px;
        display:none;
      }
      .modal.open{ display:block; animation:modalIn .18s ease; }
      @keyframes modalIn{ from{ opacity:0; transform:translate(-50%,-48%) scale(.97); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
      .modal h3{ margin:0 0 8px; font-size:16px; font-weight:800; }
      .modal p{ margin:0 0 14px; font-size:14px; line-height:1.5; color:var(--muted); }
      .modal .actions{ display:flex; gap:8px; }
      .modal .actions .btn{ flex:1; width:auto; }
      .modal .actions .btn + .btn{ margin-top:0; }

      .toast{
        position:fixed; z-index:60; left:50%; bottom:140px; transform:translateX(-50%) translateY(20px);
        background:var(--green-dark); color:#fff; font-size:13.5px; font-weight:600;
        padding:10px 16px; border-radius:99px; opacity:0; pointer-events:none;
        transition:opacity .2s ease, transform .2s ease; max-width:88vw; text-align:center;
        box-shadow:0 8px 20px rgba(20,83,45,.3);
      }
      .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="head-row">
          <div class="title">Mis gastos</div>
          <button class="month-pill" id="monthPill" aria-label="Cambiar mes">— ▾</button>
        </div>
      </header>

      <main id="view"></main>

      <button class="fab" id="fab" aria-label="Agregar gasto">+</button>

      <nav class="tabs" id="tabs">
        <button data-tab="inicio" class="on"><i>⌂</i>Inicio</button>
        <button data-tab="gastos"><i>≡</i>Gastos</button>
        <button data-tab="resumen"><i>◔</i>Resumen</button>
        <button data-tab="quincenas"><i>◐</i>Quincenas</button>
        <button data-tab="ajustes"><i>⚙</i>Ajustes</button>
      </nav>
    </div>

    <!-- Hoja: agregar / editar gasto -->
    <div class="overlay" id="overlay"></div>
    <section class="sheet" id="sheet" aria-label="Gasto">
      <h2 id="sheetTitle">Agregar gasto</h2>
      <form id="expForm">
        <div class="field">
          <label for="fAmount">Monto (RD$)</label>
          <input type="text" id="fAmount" inputmode="decimal" placeholder="0.00" autocomplete="off" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fCat">Categoría</label>
            <select id="fCat"></select>
          </div>
          <div class="field">
            <label for="fDate">Fecha</label>
            <input type="date" id="fDate" />
          </div>
        </div>
        <div class="field">
          <label for="fNote">Nota</label>
          <input type="text" id="fNote" placeholder="Ej.: Supermercado, combustible…" autocomplete="off" />
        </div>
        <div class="field">
          <label>Forma de pago</label>
          <div class="seg" id="fMethod">
            <button type="button" data-m="Efectivo" class="on">Efectivo</button>
            <button type="button" data-m="Tarjeta">Tarjeta</button>
            <button type="button" data-m="Transferencia">Transferencia</button>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn secondary" id="cancelSheet">Cancelar</button>
          <button type="submit" class="btn" id="saveSheet">Guardar gasto</button>
        </div>
        <button type="button" class="btn danger" id="deleteSheet" style="display:none;margin-top:8px">Borrar este gasto</button>
      </form>
    </section>

    <!-- Hoja: elegir mes -->
    <section class="sheet" id="monthSheet" aria-label="Elegir mes" style="z-index:42">
      <h2>Ver otro mes</h2>
      <div class="year-row">
        <button id="yearPrev" aria-label="Año anterior">‹</button>
        <b id="yearLabel">2026</b>
        <button id="yearNext" aria-label="Año siguiente">›</button>
      </div>
      <div class="month-grid" id="monthGrid"></div>
      <div class="actions" style="margin-top:14px">
        <button type="button" class="btn secondary" id="monthToday">Ir al mes actual</button>
        <button type="button" class="btn" id="monthClose">Cerrar</button>
      </div>
    </section>

    <!-- Modal de confirmación -->
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Confirmar</h3>
      <p id="modalText"></p>
      <div class="actions">
        <button type="button" class="btn secondary" id="modalCancel">Cancelar</button>
        <button type="button" class="btn danger" id="modalOk" style="border:none;background:var(--red);color:#fff">Sí, continuar</button>
      </div>
    </div>

    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
    <div class="toast" id="toast"></div>

    <script>
      "use strict";

      /* ================= Datos (guardados en este teléfono) ================= */
      var KEY = "control-de-gastos-v1";
      var PALETTE = ["#16a34a","#ea580c","#2563eb","#db2777","#ca8a04","#7c3aed","#0e9594","#dc2626","#475569","#9333ea"];
      var EMOJIS = ["🏠","🛒","🚗","💊","💡","🎬","📦","🐾","🎓","✈️","👕","🎁","💪","🧒","📱","⚽","🍔","⛽"];

      var DEFAULT_CATS = [
        { id:"casa",       name:"Casa",       icon:"🏠", color:"#16a34a" },
        { id:"comida",     name:"Comida",     icon:"🛒", color:"#ea580c" },
        { id:"transporte", name:"Transporte", icon:"🚗", color:"#2563eb" },
        { id:"salud",      name:"Salud",      icon:"💊", color:"#db2777" },
        { id:"servicios",  name:"Servicios",  icon:"💡", color:"#ca8a04" },
        { id:"ocio",       name:"Ocio",       icon:"🎬", color:"#7c3aed" },
        { id:"otros",      name:"Otros",      icon:"📦", color:"#475569" }
      ];

      function blankData(){
        return { categories: JSON.parse(JSON.stringify(DEFAULT_CATS)), budgets:{}, fixed:[], expenses:[], income:{}, otherIncome:[], seq:0 };
      }
      function loadData(){
        try{
          var raw = localStorage.getItem(KEY);
          if (!raw) return blankData();
          var d = JSON.parse(raw);
          if (!d || !Array.isArray(d.categories) || !Array.isArray(d.expenses)) return blankData();
          d.budgets = d.budgets || {}; d.fixed = d.fixed || []; d.income = d.income || {}; d.otherIncome = Array.isArray(d.otherIncome) ? d.otherIncome : []; d.seq = d.seq || 0;
          d.categories.forEach(function(c){ if (!c.icon) c.icon = "📦"; if (!c.color) c.color = "#475569"; });
          return d;
        }catch(e){ return blankData(); }
      }
      var data = loadData();
      function save(){
        try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
      }

      var now0 = new Date();
      var ui = {
        tab: "inicio",
        year: now0.getFullYear(), month: now0.getMonth(),
        sheetYear: now0.getFullYear(),
        filters: { q:"", cat:"todas", method:"todos", range:"todos", from:"", to:"" },
        newCatColor: PALETTE[0], newCatIcon: EMOJIS[0],
        fixedMethod: "Transferencia"
      };

      /* ================= Utilidades ================= */
      var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      var MESES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
      var MESES_PILL = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];

      function $(id){ return document.getElementById(id); }
      function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
      function fmt(n){ return "RD$ " + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
      function fmtNum(n){ return Number(n||0).toLocaleString("en-US",{minimumFractionDigits:0, maximumFractionDigits:0}); }
      function catById(id){
        for (var i=0;i<data.categories.length;i++) if (data.categories[i].id===id) return data.categories[i];
        return { id:id, name:"Otros", icon:"📦", color:"#475569" };
      }
      function parseDate(s){ var p=String(s).split("-"); return { y:+p[0], m:+p[1]-1, d:+p[2] }; }
      function fmtDate(s){ var p=parseDate(s); return p.d + " " + MESES_C[p.m] + " " + p.y; }
      function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
      function pad(n){ return (n<10?"0":"")+n; }
      function todayStr(){ var t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); }
      function dayLabel(s){
        var t = todayStr();
        if (s===t) return "Hoy";
        var y = new Date(); y.setDate(y.getDate()-1);
        var ys = y.getFullYear()+"-"+pad(y.getMonth()+1)+"-"+pad(y.getDate());
        if (s===ys) return "Ayer";
        var p = parseDate(s);
        return p.d + " " + MESES_C[p.m];
      }
      function toast(msg){
        var t=$("toast"); t.textContent=msg; t.classList.add("show");
        clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, 2400);
      }
      function formatAmountInput(el){
        var raw = el.value.replace(/[^0-9.]/g,"");
        var parts = raw.split(".");
        var int = parts[0].replace(/^0+(?=\d)/,"");
        var dec = parts.length>1 ? "." + parts[1].slice(0,2) : "";
        el.value = (int ? Number(int).toLocaleString("en-US") : (dec ? "0" : "")) + dec;
      }
      function parseAmount(str){ var n=parseFloat(String(str).replace(/,/g,"")); return isNaN(n)?0:n; }
      function nextId(prefix){ data.seq++; return prefix + data.seq + "-" + Date.now().toString(36); }

      /* ================= Cálculos ================= */
      /* Gastos del mes: reales + fijos generados para ese mes */
      function monthExpenses(y, m){
        var list = [];
        data.expenses.forEach(function(e){
          var p = parseDate(e.date);
          if (p.y===y && p.m===m) list.push(e);
        });
        data.fixed.forEach(function(f){
          var d = Math.min(f.day, daysInMonth(y,m));
          list.push({
            id:"gen-"+f.id+"-"+y+"-"+m, fixedId:f.id, amount:f.amount, cat:f.cat,
            date: y+"-"+pad(m+1)+"-"+pad(d), note:f.name, method:f.method, isFixed:true
          });
        });
        list.sort(function(a,b){ return a.date<b.date ? 1 : (a.date>b.date ? -1 : (b.amount-a.amount)); });
        return list;
      }
      function monthTotal(y,m){
        return monthExpenses(y,m).reduce(function(s,e){ return s+e.amount; }, 0);
      }
      function catTotals(y,m){
        var t = {};
        monthExpenses(y,m).forEach(function(e){ t[e.cat]=(t[e.cat]||0)+e.amount; });
        return t;
      }
      function totalBudget(){
        var s = 0;
        Object.keys(data.budgets).forEach(function(k){ s += data.budgets[k]||0; });
        return s;
      }
      function prevMonth(y,m){ return m===0 ? {y:y-1,m:11} : {y:y, m:m-1}; }
      function daysElapsed(y,m){
        var t = new Date();
        if (t.getFullYear()===y && t.getMonth()===m) return t.getDate();
        if (y<t.getFullYear() || (y===t.getFullYear() && m<t.getMonth())) return daysInMonth(y,m);
        return 0;
      }
      function cmpHTML(y,m){
        var total = monthTotal(y,m);
        var pm = prevMonth(y,m);
        var prev = monthTotal(pm.y, pm.m);
        if (prev===0 && total===0) return '<span class="cmp dim">Sin gastos registrados en este mes.</span>';
        if (prev===0) return '<span class="cmp dim">El mes pasado no hubo gastos registrados.</span>';
        var diff = total - prev;
        var pct = Math.abs(Math.round(diff/prev*100));
        if (diff<=0) return '<span class="cmp">▼ ' + pct + '% frente a ' + MESES[pm.m] + ' (' + fmt(prev) + ')</span>';
        return '<span class="cmp">▲ ' + pct + '% frente a ' + MESES[pm.m] + ' (' + fmt(prev) + ')</span>';
      }
      function alertsHTML(y,m, withTitle){
        var totals = catTotals(y,m), out = "";
        data.categories.forEach(function(c){
          var limit = data.budgets[c.id];
          if (!limit) return;
          var spent = totals[c.id]||0;
          if (spent > limit){
            out += '<div class="alert over"><span class="dot"></span><div><b>'+esc(c.name)+': te pasaste del presupuesto.</b><br>Gastado '+fmt(spent)+' de '+fmt(limit)+' — '+fmt(spent-limit)+' por encima del tope.</div></div>';
          } else if (spent >= limit*0.8){
            out += '<div class="alert near"><span class="dot"></span><div><b>'+esc(c.name)+': estás cerca del tope.</b><br>Te quedan '+fmt(limit-spent)+' de '+fmt(limit)+' este mes.</div></div>';
          }
        });
        if (out && withTitle) out = '<h2 class="sec-title">Avisos</h2>' + out;
        return out;
      }

      /* ================= Render principal ================= */
      function render(){
        $("monthPill").innerHTML = MESES_PILL[ui.month] + " " + ui.year + " ▾";
        document.querySelectorAll("#tabs button").forEach(function(b){
          b.classList.toggle("on", b.dataset.tab===ui.tab);
        });
        if (ui.tab==="inicio") renderInicio();
        else if (ui.tab==="gastos") renderGastos();
        else if (ui.tab==="resumen") renderResumen();
        else if (ui.tab==="quincenas") renderQuincenas();
        else renderAjustes();
      }

      /* ---------- Inicio (igual al ejemplo) ---------- */
      function renderInicio(){
        var y=ui.year, m=ui.month;
        var total = monthTotal(y,m);
        var budget = totalBudget();
        var rest = budget - total;
        var elapsed = daysElapsed(y,m);
        var avg = elapsed>0 ? total/elapsed : 0;

        var html = "";
        html += '<div class="hero"><small>Total gastado</small>'
              + '<div class="total">' + fmt(total) + '</div>'
              + cmpHTML(y,m) + '</div>';

        html += '<div class="statgrid">';
        if (budget>0){
          html += '<div class="stat"><small>Presupuesto</small><b>RD$ ' + fmtNum(budget) + '</b>'
                + (rest>=0
                    ? '<span class="sub ok">Quedan RD$ ' + fmtNum(rest) + '</span>'
                    : '<span class="sub bad">Pasado por RD$ ' + fmtNum(-rest) + '</span>')
                + '</div>';
        } else {
          html += '<div class="stat"><small>Presupuesto</small><b>Sin tope</b>'
                + '<span class="sub">Pon topes en Resumen</span></div>';
        }
        html += '<div class="stat"><small>Promedio / día</small><b>' + (elapsed>0 ? "RD$ " + fmtNum(Math.round(avg)) : "—") + '</b>'
              + '<span class="sub">' + (elapsed>0 ? elapsed + (elapsed===1?" día":" días") + ' de ' + MESES[m] : 'Mes sin días transcurridos') + '</span></div>';
        html += '</div>';

        html += alertsHTML(y,m,true);

        /* Por categoría */
        var totals = catTotals(y,m);
        var rows = data.categories
          .map(function(c){ return { c:c, v:totals[c.id]||0 }; })
          .filter(function(r){ return r.v>0; })
          .sort(function(a,b){ return b.v-a.v; });
        html += '<h2 class="sec-title">Por categoría</h2>';
        if (!rows.length){
          html += '<div class="empty">No hay gastos en ' + MESES[m] + ' todavía.<br>Toca el botón + para agregar el primero.</div>';
        } else {
          rows.forEach(function(r){
            html += '<div class="expense"><div class="ic">' + esc(r.c.icon) + '</div>'
              + '<div class="meta"><b>' + esc(r.c.name) + '</b><small>' + Math.round(r.v/total*100) + '% del mes</small></div>'
              + '<div class="amt">' + fmtNum(r.v) + '</div></div>';
          });
        }

        /* Movimientos recientes */
        var list = monthExpenses(y,m);
        html += '<h2 class="sec-title">Movimientos recientes</h2>';
        if (!list.length){
          html += '<div class="empty">Sin movimientos en ' + MESES[m] + '.</div>';
        } else {
          list.slice(0,5).forEach(function(e){
            html += '<div class="expense"><div class="meta"><b>' + esc(e.note || catById(e.cat).name) + (e.isFixed?'<span class="tag">Fijo</span>':"") + '</b>'
              + '<small>' + dayLabel(e.date) + ' · ' + esc(e.method) + '</small></div>'
              + '<div class="amt">−' + fmtNum(e.amount) + '</div></div>';
          });
          if (list.length>5) html += '<button class="mini-link" id="seeAll">Ver todos los gastos de ' + MESES[m] + ' →</button>';
        }
        $("view").innerHTML = html;
        var sa = $("seeAll");
        if (sa) sa.addEventListener("click", function(){ ui.tab="gastos"; render(); window.scrollTo(0,0); });
      }

      /* ---------- Gastos: buscador y filtros ---------- */
      function expRowHTML(e){
        var c = catById(e.cat);
        var inner = '<div class="ic">' + esc(c.icon) + '</div>'
          + '<div class="meta"><b>' + esc(e.note || c.name) + (e.isFixed?'<span class="tag">Fijo</span>':"") + '</b>'
          + '<small>' + esc(c.name) + ' · ' + esc(e.method) + ' · ' + fmtDate(e.date) + '</small></div>'
          + '<div class="amt">−' + fmtNum(e.amount) + '</div>';
        if (e.isFixed) return '<div class="expense">' + inner + '</div>';
        return '<button type="button" class="expense" data-edit="' + e.id + '">' + inner + '</button>';
      }
      function filteredExpenses(){
        var f = ui.filters;
        var list;
        if (f.from || f.to){
          list = [];
          data.expenses.forEach(function(e){
            if (f.from && e.date < f.from) return;
            if (f.to && e.date > f.to) return;
            list.push(e);
          });
          /* fijos dentro del rango de fechas */
          var start = f.from ? parseDate(f.from) : null;
          var end = f.to ? parseDate(f.to) : null;
          var sy = start ? start.y : ui.year, sm = start ? start.m : ui.month;
          var ey = end ? end.y : ui.year, em = end ? end.m : ui.month;
          var guard = 0;
          while ((sy<ey || (sy===ey && sm<=em)) && guard<48){
            data.fixed.forEach(function(fx){
              var d = Math.min(fx.day, daysInMonth(sy,sm));
              var ds = sy+"-"+pad(sm+1)+"-"+pad(d);
              if (f.from && ds < f.from) return;
              if (f.to && ds > f.to) return;
              list.push({ id:"gen-"+fx.id+"-"+sy+"-"+sm, fixedId:fx.id, amount:fx.amount, cat:fx.cat, date:ds, note:fx.name, method:fx.method, isFixed:true });
            });
            sm++; if (sm>11){ sm=0; sy++; } guard++;
          }
          list.sort(function(a,b){ return a.date<b.date ? 1 : (a.date>b.date ? -1 : (b.amount-a.amount)); });
        } else {
          list = monthExpenses(ui.year, ui.month);
        }
        return list.filter(function(e){
          if (f.cat!=="todas" && e.cat!==f.cat) return false;
          if (f.method!=="todos" && e.method!==f.method) return false;
          if (f.range==="bajo" && !(e.amount<1000)) return false;
          if (f.range==="medio" && !(e.amount>=1000 && e.amount<=5000)) return false;
          if (f.range==="alto" && !(e.amount>5000)) return false;
          if (f.q){
            var q = f.q.toLowerCase();
            var hay = ((e.note||"")+" "+catById(e.cat).name+" "+e.method).toLowerCase();
            if (hay.indexOf(q)===-1) return false;
          }
          return true;
        });
      }
      function updateGastosList(){
        var wrap = $("listWrap");
        if (!wrap) return;
        var list = filteredExpenses();
        var sub = list.reduce(function(s,e){ return s+e.amount; }, 0);
        var scope = (ui.filters.from || ui.filters.to) ? "en el rango elegido" : "en " + MESES[ui.month];
        var html = '<div class="list-head"><span><b>' + list.length + '</b> ' + (list.length===1?"gasto":"gastos") + ' ' + scope + '</span><span>Total: <b>' + fmt(sub) + '</b></span></div>';
        if (!list.length) html += '<div class="empty">Ningún gasto coincide con esos filtros.</div>';
        else list.forEach(function(e){ html += expRowHTML(e); });
        wrap.innerHTML = html;
        wrap.querySelectorAll("[data-edit]").forEach(function(b){
          b.addEventListener("click", function(){ openSheet(b.getAttribute("data-edit")); });
        });
      }
      function renderGastos(){
        var f = ui.filters;
        var catOpts = '<option value="todas">Todas las categorías</option>' + data.categories.map(function(c){
          return '<option value="' + c.id + '"' + (f.cat===c.id?" selected":"") + '>' + esc(c.name) + '</option>';
        }).join("");
        var html = '<div class="filters">'
          + '<input type="text" id="fltQ" placeholder="Buscar por nota, categoría o pago…" value="' + esc(f.q) + '" autocomplete="off" />'
          + '<div class="row"><select id="fltCat">' + catOpts + '</select>'
          + '<select id="fltMethod">'
          +   '<option value="todos"' + (f.method==="todos"?" selected":"") + '>Todo pago</option>'
          +   '<option value="Efectivo"' + (f.method==="Efectivo"?" selected":"") + '>Efectivo</option>'
          +   '<option value="Tarjeta"' + (f.method==="Tarjeta"?" selected":"") + '>Tarjeta</option>'
          +   '<option value="Transferencia"' + (f.method==="Transferencia"?" selected":"") + '>Transferencia</option>'
          + '</select>'
          + '<select id="fltRange">'
          +   '<option value="todos"' + (f.range==="todos"?" selected":"") + '>Todo monto</option>'
          +   '<option value="bajo"' + (f.range==="bajo"?" selected":"") + '>Menos de RD$ 1,000</option>'
          +   '<option value="medio"' + (f.range==="medio"?" selected":"") + '>RD$ 1,000 – 5,000</option>'
          +   '<option value="alto"' + (f.range==="alto"?" selected":"") + '>Más de RD$ 5,000</option>'
          + '</select></div>'
          + '<div class="row"><div><label style="font-size:11px;font-weight:700;color:var(--muted)">DESDE</label><input type="date" id="fltFrom" value="' + esc(f.from) + '" /></div>'
          + '<div><label style="font-size:11px;font-weight:700;color:var(--muted)">HASTA</label><input type="date" id="fltTo" value="' + esc(f.to) + '" /></div></div>'
          + ((f.from||f.to||f.q||f.cat!=="todas"||f.method!=="todos"||f.range!=="todos")
              ? '<button class="mini-link" id="fltClear" style="align-self:flex-start">Limpiar filtros — ver ' + MESES[ui.month] + '</button>' : '')
          + '</div><div id="listWrap"></div>';
        $("view").innerHTML = html;
        updateGastosList();
        $("fltQ").addEventListener("input", function(){ ui.filters.q=this.value; updateGastosList(); syncClearBtn(); });
        $("fltCat").addEventListener("change", function(){ ui.filters.cat=this.value; updateGastosList(); syncClearBtn(); });
        $("fltMethod").addEventListener("change", function(){ ui.filters.method=this.value; updateGastosList(); syncClearBtn(); });
        $("fltRange").addEventListener("change", function(){ ui.filters.range=this.value; updateGastosList(); syncClearBtn(); });
        $("fltFrom").addEventListener("change", function(){ ui.filters.from=this.value; updateGastosList(); syncClearBtn(); });
        $("fltTo").addEventListener("change", function(){ ui.filters.to=this.value; updateGastosList(); syncClearBtn(); });
        var clr = $("fltClear");
        if (clr) clr.addEventListener("click", clearFilters);
      }
      function syncClearBtn(){
        var f = ui.filters;
        var active = (f.from||f.to||f.q||f.cat!=="todas"||f.method!=="todos"||f.range!=="todos");
        var clr = $("fltClear");
        if (active && !clr) renderGastosSoft();
        if (!active && clr) renderGastosSoft();
      }
      function renderGastosSoft(){
        var q = $("fltQ"), pos = q ? q.selectionStart : null, hadFocus = document.activeElement===q;
        renderGastos();
        if (hadFocus){ var q2=$("fltQ"); q2.focus(); if (pos!=null){ try{ q2.setSelectionRange(pos,pos); }catch(e){} } }
      }
      function clearFilters(){
        ui.filters = { q:"", cat:"todas", method:"todos", range:"todos", from:"", to:"" };
        renderGastos();
      }

      /* ---------- Quincenas: ingreso y gastos por mitad del mes ---------- */
      function incomeKey(y,m){ return y + "-" + pad(m+1); }
      function getIncome(y,m){
        var inc = data.income[incomeKey(y,m)];
        return inc ? { q1: inc.q1||0, q2: inc.q2||0 } : { q1:0, q2:0 };
      }
      /* Ciclo de pago: 1ª quincena del 9 al 23 del mes; 2ª del 24 al 8 del mes siguiente */
      function nextMonthOf(y,m){ return m===11 ? { y:y+1, m:0 } : { y:y, m:m+1 }; }
      function quincenaRange(y,m,half){
        if (half===1) return { from: y+"-"+pad(m+1)+"-09", to: y+"-"+pad(m+1)+"-23" };
        var nx = nextMonthOf(y,m);
        return { from: y+"-"+pad(m+1)+"-24", to: nx.y+"-"+pad(nx.m+1)+"-08" };
      }
      function quincenaExpenses(y,m,half){
        var r = quincenaRange(y,m,half);
        var pool = monthExpenses(y,m);
        if (half===2){
          var nx = nextMonthOf(y,m);
          pool = pool.concat(monthExpenses(nx.y, nx.m));
        }
        var list = pool.filter(function(e){ return e.date>=r.from && e.date<=r.to; });
        list.sort(function(a,b){ return a.date<b.date ? 1 : (a.date>b.date ? -1 : (b.amount-a.amount)); });
        return list;
      }
      /* Otros ingresos: cada registro cae en la quincena de su fecha
         (días 1–8 → 2ª quincena del mes anterior; 9–23 → 1ª; 24–fin → 2ª) */
      function otherOwner(dateStr){
        var p = parseDate(dateStr);
        if (p.d>=9 && p.d<=23) return { y:p.y, m:p.m, half:1 };
        if (p.d>=24) return { y:p.y, m:p.m, half:2 };
        var pm = prevMonth(p.y, p.m);
        return { y:pm.y, m:pm.m, half:2 };
      }
      function otherForQuincena(y,m,half){
        return (data.otherIncome||[]).filter(function(o){
          var ow = otherOwner(o.date);
          return ow.y===y && ow.m===m && ow.half===half;
        }).sort(function(a,b){ return a.date<b.date ? 1 : (a.date>b.date ? -1 : (b.amount-a.amount)); });
      }
      function otherRowHTML(o){
        var label = esc(o.concept || "Otro ingreso") + (o.note ? " · " + esc(o.note) : "");
        return '<div class="expense"><div class="ic">💰</div>'
          + '<div class="meta"><b>' + label + '<span class="tag">Extra</span></b>'
          + '<small>Otro ingreso · ' + fmtDate(o.date) + '</small></div>'
          + '<div class="amt pos">+' + fmtNum(o.amount) + '</div>'
          + '<button class="icon-btn" data-delother="' + o.id + '" aria-label="Borrar otro ingreso">' + trashSVG + '</button></div>';
      }
      function quincenaCardHTML(y,m,half,title,range,ingreso,list,others){
        others = others || [];
        var otherSum = others.reduce(function(s,o){ return s+o.amount; }, 0);
        var totalInc = ingreso + otherSum;
        var spent = list.reduce(function(s,e){ return s+e.amount; }, 0);
        var avail = totalInc - spent;
        var over = totalInc>0 && spent>totalInc;
        var pct = totalInc>0 ? Math.min(100, Math.round(spent/totalInc*100)) : (spent>0 ? 100 : 0);
        var barCls = over ? "over" : (totalInc>0 && spent>=totalInc*0.8 ? "near" : "");
        var html = '<div class="qcard">'
          + '<div class="qtop"><b>' + title + '</b><span>' + range + '</span></div>'
          + '<div class="field" style="margin-top:10px;margin-bottom:0"><label for="inc-q' + half + '">Ingreso de esta quincena (RD$)</label>'
          + '<input type="text" inputmode="decimal" id="inc-q' + half + '" data-income="q' + half + '" value="' + (ingreso ? ingreso.toLocaleString("en-US") : "") + '" placeholder="0.00" autocomplete="off" /></div>';
        if (otherSum>0){
          html += '<div class="other-line"><span>Otros ingresos de esta quincena</span><b>+' + fmt(otherSum) + '</b></div>'
            + '<div class="other-line" style="margin-top:3px"><span>Ingreso total</span><b>' + fmt(totalInc) + '</b></div>';
        }
        html += '<div class="bar"><i class="' + barCls + '" style="width:' + pct + '%;background:var(--green)"></i></div>'
          + '<div class="qnums">'
          + '<div class="qn"><small>Gastado</small><b>' + fmtNum(spent) + '</b></div>'
          + '<div class="qn"><small>Disponible</small><b class="' + (avail<0 ? "status-over" : "status-ok") + '">' + ((totalInc>0 || spent>0) ? fmtNum(avail) : "—") + '</b></div>'
          + '<div class="qn"><small>Gastos</small><b>' + list.length + '</b></div>'
          + '</div>';
        if (over){
          html += '<div class="alert over"><span class="dot"></span><div><b>Gastos por encima del ingreso.</b><br>Gastaste ' + fmt(spent) + ' y el ingreso fue ' + fmt(totalInc) + ': ' + fmt(spent-totalInc) + ' por encima.</div></div>';
        } else if (totalInc>0 && spent>=totalInc*0.8){
          html += '<div class="alert near"><span class="dot"></span><div><b>Estás cerca del límite de esta quincena.</b><br>Te quedan ' + fmt(avail) + ' de ' + fmt(totalInc) + '.</div></div>';
        } else if (totalInc===0){
          html += '<p class="hint" style="margin:10px 0 0">Escribe el ingreso de esta quincena para ver cuánto te queda disponible.</p>';
        }
        if (others.length){
          html += '<div style="margin-top:4px">' + others.map(otherRowHTML).join("") + '</div>';
        }
        if (list.length){
          html += '<div style="margin-top:4px">' + list.map(expRowHTML).join("") + '</div>';
        }
        html += '</div>';
        return html;
      }
      function renderQuincenas(){
        var y=ui.year, m=ui.month;
        var inc = getIncome(y,m);
        var list1 = quincenaExpenses(y,m,1);
        var list2 = quincenaExpenses(y,m,2);
        var oth1 = otherForQuincena(y,m,1);
        var oth2 = otherForQuincena(y,m,2);
        var otherTot = oth1.concat(oth2).reduce(function(s,o){ return s+o.amount; }, 0);

      /* ================= Exportaciones ================= */
      function download(blob, filename){
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      }

        var out = {
          app: "Control de gastos",
          version: 1,
          exportado: new Date().toISOString(),
          categorias: data.categories,
          presupuestos: data.budgets,
          gastos_fijos: data.fixed,
          gastos: data.expenses,
          ingresos: data.income,
          otros_ingresos: data.otherIncome || []
        };
        download(new Blob([JSON.stringify(out, null, 2)], { type:"application/json" }), "respaldo-control-de-gastos.json");
        toast("Respaldo descargado");
      }
      function csvCell(v){

      function exportExcel(){
        var rows = [["Fecha","Nota","Categoría","Forma de pago","Tipo","Monto (RD$)"]];
        var all = data.expenses.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
        all.forEach(function(e){
          rows.push([fmtDate(e.date), e.note||"", catById(e.cat).name, e.method, "Gasto", Number(e.amount).toFixed(2)]);
        });
        data.fixed.forEach(function(f){
          rows.push(["Día " + f.day + " de cada mes", f.name, catById(f.cat).name, f.method, "Fijo mensual", Number(f.amount).toFixed(2)]);
        });

          rows.push([fmtDate(o.date), (o.concept || "Otro ingreso") + (o.note ? " · " + o.note : ""), "Otros ingresos", "", "Otro ingreso", Number(o.amount).toFixed(2)]);
        });
        var csv = rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n");

      /* --- PDF mínimo generado a mano (sin librerías) --- */
      var WINANSI = {"á":225,"é":233,"í":237,"ó":243,"ú":250,"ñ":241,"ü":252,"Á":193,"É":201,"Í":205,"Ó":211,"Ú":218,"Ñ":209,"Ü":220,"¡":161,"¿":191,"–":150,"—":151,"“":147,"”":148,"‘":145,"’":146,"•":149,"…":133,"€":128};
      function pdfBytes(str){
        var out = [];
        for (var i=0;i<str.length;i++){
          var code = str.charCodeAt(i);
          if (code<128) out.push(code);
          else if (WINANSI[str.charAt(i)]!=null) out.push(WINANSI[str.charAt(i)]);
          else out.push(63);
        }
        return out;
      }
      function buildPDF(pages){
        /* pages: array de páginas; cada página es array de ops {f:1|2, s:size, x, y, t:text} */
        var bytes = [];
        function pushStr(s){ var b = pdfBytes(s); for (var i=0;i<b.length;i++) bytes.push(b[i]); }
        var offsets = {};
        var pageObjNums = [];
        var contentObjNums = [];
        var firstPageObj = 5;
        pages.forEach(function(pg, i){ pageObjNums.push(firstPageObj + i*2); contentObjNums.push(firstPageObj + i*2 + 1); });
        var totalObjs = firstPageObj + pages.length*2 - 1;

        pushStr("%PDF-1.4\n");
        offsets[1] = bytes.length;
        pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
        offsets[2] = bytes.length;
        pushStr("2 0 obj\n<< /Type /Pages /Kids [" + pageObjNums.map(function(n){ return n+" 0 R"; }).join(" ") + "] /Count " + pages.length + " >>\nendobj\n");
        offsets[3] = bytes.length;
        pushStr("3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n");
        offsets[4] = bytes.length;
        pushStr("4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n");
        pages.forEach(function(ops, i){
          var content = "";
          ops.forEach(function(op){
            content += "BT /F" + op.f + " " + op.s + " Tf 1 0 0 1 " + op.x + " " + op.y + " Tm (" +
              op.t.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)") + ") Tj ET\n";
          });
          var cnum = contentObjNums[i], pnum = pageObjNums[i];
          offsets[pnum] = bytes.length;
          pushStr(pnum + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + cnum + " 0 R >>\nendobj\n");
          offsets[cnum] = bytes.length;
          pushStr(cnum + " 0 obj\n<< /Length " + pdfBytes(content).length + " >>\nstream\n");
          pushStr(content);
          pushStr("endstream\nendobj\n");
        });
        var xrefPos = bytes.length;
        var xref = "xref\n0 " + (totalObjs+1) + "\n0000000000 65535 f \n";
        for (var n=1;n<=totalObjs;n++){
          var off = String(offsets[n]||0);
          while (off.length<10) off = "0" + off;
          xref += off + " 00000 n \n";
        }
        xref += "trailer\n<< /Size " + (totalObjs+1) + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF";
        pushStr(xref);
        return new Blob([new Uint8Array(bytes)], { type:"application/pdf" });
      }
      function exportPDF(){
        var y = ui.year, m = ui.month;
        var total = monthTotal(y,m);
        var budget = totalBudget();
        var pm = prevMonth(y,m);
        var prev = monthTotal(pm.y, pm.m);
        var t = new Date();
        var genStr = t.getDate() + " " + MESES_C[t.getMonth()] + " " + t.getFullYear();

        var lines = [];
        lines.push({ f:2, s:17, t:"Control de gastos" });
        lines.push({ f:1, s:11, t:"Resumen de " + MESES[m] + " " + y + "  ·  Generado el " + genStr });
        lines.push({ f:1, s:6, t:"" });
        lines.push({ f:2, s:13, t:"Total gastado: " + fmt(total) });
        if (budget>0) lines.push({ f:1, s:11, t:"Presupuesto total: " + fmt(budget) + "  ·  " + (total<=budget ? "Quedan " + fmt(budget-total) : "Pasado por " + fmt(total-budget)) });
        lines.push({ f:1, s:11, t:"Mes anterior (" + MESES[pm.m] + " " + pm.y + "): " + fmt(prev) });
        lines.push({ f:1, s:6, t:"" });
        lines.push({ f:2, s:12, t:"Por categoría" });
        var totals = catTotals(y,m);
        var rows = data.categories.map(function(c){ return { c:c, v:totals[c.id]||0 }; })
          .filter(function(r){ return r.v>0; }).sort(function(a,b){ return b.v-a.v; });
        if (!rows.length) lines.push({ f:1, s:11, t:"Sin gastos registrados en este mes." });
        rows.forEach(function(r){
          var pct = total>0 ? Math.round(r.v/total*100) : 0;
          var lim = data.budgets[r.c.id];
          lines.push({ f:1, s:11, t: r.c.name + ": " + fmt(r.v) + " (" + pct + "%)" + (lim ? "  ·  Tope " + fmt(lim) + (r.v>lim ? " — PASADO" : "") : "") });
        });
        lines.push({ f:1, s:6, t:"" });
        lines.push({ f:2, s:12, t:"Movimientos de " + MESES[m] });
        var list = monthExpenses(y,m);
        if (!list.length) lines.push({ f:1, s:11, t:"Sin movimientos." });
        list.forEach(function(e){
          var txt = fmtDate(e.date) + "  ·  " + (e.note||catById(e.cat).name) + "  ·  " + catById(e.cat).name + "  ·  " + e.method + (e.isFixed?"  ·  Fijo":"") + "  ·  " + fmt(e.amount);
          if (txt.length>102) txt = txt.slice(0,99) + "...";
          lines.push({ f:1, s:10, t: txt });
        });

        var pages = [], ops = [], yy = 792;
        lines.forEach(function(ln){
          var h = ln.s * 1.55;
          if (yy - h < 48){ pages.push(ops); ops = []; yy = 792; }
          yy -= h;
          if (ln.t) ops.push({ f:ln.f, s:ln.s, x:48, y:yy, t:ln.t });
        });
        if (ops.length || !pages.length) pages.push(ops);
        download(buildPDF(pages), "resumen-gastos-" + MESES_C[m] + "-" + y + ".pdf");
        toast("PDF descargado");
      }

      /* ================= Importar respaldo ================= */
      $("importFile").addEventListener("change", function(){
        var file = this.files && this.files[0];
        this.value = "";
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          var parsed;
          try{ parsed = JSON.parse(reader.result); }catch(e){ toast("Ese archivo no es un respaldo válido"); return; }
          var cats = parsed.categorias || parsed.categories;
          var exps = parsed.gastos || parsed.expenses;
          if (!Array.isArray(cats) || !Array.isArray(exps)){ toast("Ese archivo no es un respaldo válido"); return; }
          openModal("Importar respaldo", "Se reemplazarán TODOS los datos actuales por los del respaldo (" + exps.length + " gastos). ¿Continuar?", "Sí, importar", function(){
            data = {
              categories: cats,
              budgets: parsed.presupuestos || parsed.budgets || {},
              fixed: parsed.gastos_fijos || parsed.fixed || [],
              expenses: exps,
              income: parsed.ingresos || parsed.income || {},
              otherIncome: parsed.otros_ingresos || parsed.otherIncome || [],
              seq: Date.now()
            };
            data.categories.forEach(function(c){ if (!c.icon) c.icon="📦"; if (!c.color) c.color="#475569"; });
            save(); toast("Respaldo importado"); render();
          });
        };
        reader.readAsText(file);
      });

      /* ================= Modal de confirmación ================= */
      var modalCb = null;
      function openModal(title, text, okLabel, cb){
        $("modalTitle").textContent = title;
        $("modalText").textContent = text;
        $("modalOk").textContent = okLabel;
        modalCb = cb;
        $("overlay").classList.add("open");
        $("modal").classList.add("open");
      }
      function closeModal(){
        $("modal").classList.remove("open");
        if (!$("sheet").classList.contains("open") && !$("monthSheet").classList.contains("open")) $("overlay").classList.remove("open");
        modalCb = null;
      }
      $("modalCancel").addEventListener("click", closeModal);
      $("modalOk").addEventListener("click", function(){ var cb = modalCb; closeModal(); if (cb) cb(); });

      /* ================= Hoja de gasto (agregar / editar) ================= */
      var sheetMethod = "Efectivo";
      var editingId = null;
      function setMethod(m){
        sheetMethod = m;
        document.querySelectorAll("#fMethod button").forEach(function(b){ b.classList.toggle("on", b.dataset.m===m); });
      }
      function fillCatSelect(sel){
        $("fCat").innerHTML = data.categories.map(function(c){
          return '<option value="' + c.id + '"' + (c.id===sel?" selected":"") + '>' + esc(c.name) + '</option>';
        }).join("");
      }
      function openSheet(editId){
        editingId = editId || null;
        var e = null;
        if (editingId){
          for (var i=0;i<data.expenses.length;i++) if (data.expenses[i].id===editingId) e = data.expenses[i];
          if (!e){ editingId = null; }
        }
        $("sheetTitle").textContent = e ? "Editar gasto" : "Agregar gasto";
        $("saveSheet").textContent = e ? "Guardar cambios" : "Guardar gasto";
        $("deleteSheet").style.display = e ? "block" : "none";
        fillCatSelect(e ? e.cat : undefined);
        if (e){
          $("fAmount").value = Number(e.amount).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
          $("fNote").value = e.note || "";
          $("fDate").value = e.date;
          setMethod(e.method || "Efectivo");
        } else {
          $("fAmount").value = ""; $("fNote").value = "";
          var t = new Date();
          var base = (t.getFullYear()===ui.year && t.getMonth()===ui.month)
            ? t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())
            : ui.year+"-"+pad(ui.month+1)+"-"+pad(Math.min(t.getDate(), daysInMonth(ui.year, ui.month)));
          $("fDate").value = base;
          setMethod("Efectivo");
        }
        $("overlay").classList.add("open");
        $("sheet").classList.add("open");
        setTimeout(function(){ $("fAmount").focus(); }, 280);
      }
      function closeSheet(){
        $("sheet").classList.remove("open");
        if (!$("monthSheet").classList.contains("open") && !$("modal").classList.contains("open")) $("overlay").classList.remove("open");
        editingId = null;
      }
      $("fab").addEventListener("click", function(){ openSheet(null); });
      $("overlay").addEventListener("click", function(){
        if ($("modal").classList.contains("open")){ closeModal(); return; }
        closeSheet(); closeMonthSheet();
      });
      $("cancelSheet").addEventListener("click", closeSheet);
      $("fAmount").addEventListener("input", function(){ formatAmountInput(this); });
      document.querySelectorAll("#fMethod button").forEach(function(b){
        b.addEventListener("click", function(){ setMethod(b.dataset.m); });
      });
      $("deleteSheet").addEventListener("click", function(){
        if (!editingId) return;
        var id = editingId;
        closeSheet();
        data.expenses = data.expenses.filter(function(x){ return x.id!==id; });
        save(); toast("Gasto borrado"); render();
      });
      $("expForm").addEventListener("submit", function(ev){
        ev.preventDefault();
        var amount = parseAmount($("fAmount").value);
        if (!(amount>0)){ toast("Escribe un monto válido"); return; }
        var date = $("fDate").value;
        if (!date){ toast("Elige la fecha del gasto"); return; }
        var catId = $("fCat").value;
        var note = $("fNote").value.trim() || catById(catId).name;
        if (editingId){
          for (var i=0;i<data.expenses.length;i++){
            if (data.expenses[i].id===editingId){
              data.expenses[i] = { id:editingId, amount:amount, cat:catId, date:date, note:note, method:sheetMethod };
            }
          }
          toast("Gasto actualizado");
        } else {
          data.expenses.push({ id: nextId("e"), amount:amount, cat:catId, date:date, note:note, method:sheetMethod });
          toast("Gasto agregado: " + fmt(amount));
        }
        save();
        closeSheet();
        var p = parseDate(date);
        if (p.y!==ui.year || p.m!==ui.month){ ui.year=p.y; ui.month=p.m; }
        render();
      });

      /* ================= Hoja de mes ================= */
      function renderMonthGrid(){
        $("yearLabel").textContent = ui.sheetYear;
        $("monthGrid").innerHTML = MESES.map(function(name, i){
          var on = (ui.sheetYear===ui.year && i===ui.month) ? " on" : "";
          return '<button type="button" data-m="' + i + '" class="' + on.trim() + '">' + MESES_C[i] + '</button>';
        }).join("");
        document.querySelectorAll("#monthGrid button").forEach(function(b){
          b.addEventListener("click", function(){
            ui.month = +b.dataset.m; ui.year = ui.sheetYear;
            closeMonthSheet(); render(); window.scrollTo(0,0);
          });
        });
      }
      function openMonthSheet(){
        ui.sheetYear = ui.year;
        renderMonthGrid();
        $("overlay").classList.add("open");
        $("monthSheet").classList.add("open");
      }
      function closeMonthSheet(){
        $("monthSheet").classList.remove("open");
        if (!$("sheet").classList.contains("open") && !$("modal").classList.contains("open")) $("overlay").classList.remove("open");
      }
      $("monthPill").addEventListener("click", openMonthSheet);
      $("monthClose").addEventListener("click", closeMonthSheet);
      $("yearPrev").addEventListener("click", function(){ ui.sheetYear--; renderMonthGrid(); });
      $("yearNext").addEventListener("click", function(){ ui.sheetYear++; renderMonthGrid(); });
      $("monthToday").addEventListener("click", function(){
        var t = new Date(); ui.year = t.getFullYear(); ui.month = t.getMonth();
        closeMonthSheet(); render(); window.scrollTo(0,0);
      });

      /* ================= Navegación ================= */
      document.querySelectorAll("#tabs button").forEach(function(b){
        b.addEventListener("click", function(){ ui.tab = b.dataset.tab; render(); window.scrollTo(0,0); });
      });

      render();
    </script>
  </body>
</html>
